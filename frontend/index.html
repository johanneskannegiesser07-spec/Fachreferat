<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 KI-Lern-Buddy</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🤖 KI-Lern-Buddy</h1>
                <p>Intelligente Lernunterstützung mit KI-Personalisierung</p>
            </div>
            <div class="user-info">
                <span id="usernameDisplay">Lade...</span>
                <button class="school" onclick="window.location.href='/school-setup'">🏫 Schulkonfig</button>
                <button class="logout" onclick="logout()">Logout</button>
            </div>
            
            <div class="nav_bar">
                 <button onclick="window.location.href='/flashcards'" style="background: #6f42c1; margin-left: 10px;">
                    🃏 Karteikarten
                </button>
                <button onclick="window.location.href='/static/planner.html'" style="background: #17a2b8; margin-left: 10px;">
                    📅 Lernplaner
                </button>
                <button onclick="window.location.href='/static/grades.html'" style="background: #e0a800; margin-left: 10px;">
                    📊 Noten
                </button>
                <button onclick="window.location.href='/materials'" style="background: #fd7e14; margin-left: 10px;">
                    📄 Material
                </button>
                <button onclick="window.location.href='/test'" style="background: #28a745; margin-left: 10px;">
                    🧪 Test-Modus
                </button>
                <button onclick="window.location.href='/chat'" style="background: #007bff; margin-left: 10px;">
                💬 KI-Chat
                </button>
                <button onclick="window.location.href='/game'" style="background: #444; margin-left: 10px; cursor: default;">
                🎮 Spielen
                </button>
            </div>
        </header>

        <div id="debug" class="debug"></div>

        <div class="card">
            <h2>🏫 Meine Schule</h2>
            <div id="schoolInfo" class="school-info">
                Lade Schulinformationen...
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <button onclick="loadSchoolContext()">Schuldaten aktualisieren</button>
                <button onclick="showSchoolSetup()" style="background: #28a745;">Schulkonfiguration bearbeiten</button>
            </div>
        </div>

        <div class="card">
            <h2>🕸️ Dein Wissens-Netzwerk</h2>
            <p style="color: #666; margin-bottom: 10px;">Deine interdisziplinären Stärken visualisiert.</p>
            <div id="knowledgeGraph" style="height: 400px; border: 1px solid #eee; border-radius: 8px; background: #1a1a1a;">
                <p style="text-align: center; padding-top: 180px; color: #ccc;">Lade Netzwerk...</p>
            </div>
            <div style="text-align: right; margin-top: 10px;">
                <button onclick="loadKnowledgeGraph()" class="secondary" style="font-size: 0.8rem;">🔄 Aktualisieren</button>
            </div>
        </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin-bottom: 0; border-bottom: none;">📊 Test-Historie</h2>
            <button onclick="loadTestHistory()" style="background: #6c757d; font-size: 0.9rem; padding: 8px 15px;">
                🔄 Aktualisieren
            </button>
        </div>
        <div id="testHistory">
            <p>Lade Test-Historie...</p>
        </div>
    </div>

    <script src="/static/common.js"></script>
    <script src="/static/dashboard.js"></script>
</body>
</html>

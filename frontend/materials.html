<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📄 Material Upload - KI-Lern-Buddy</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🤖 KI-Lern-Buddy</h1>
                <p>Intelligente Lernunterstützung mit KI-Personalisierung</p>
            </div>
            <div class="user-info">
                <span id="usernameDisplay">Lade...</span>
                <button class="school" onclick="window.location.href='/school-setup'">🏫 Schulkonfig</button>
                <button class="logout" onclick="logout()">Logout</button>
            </div>
            
            <div class="nav_bar">
                <button onclick="window.location.href='/'" style="background: #007bff; margin-left: 10px;">
                Dashboard
                </button>
                 <button onclick="window.location.href='/flashcards'" style="background: #6f42c1; margin-left: 10px;">
                    🃏 Karteikarten
                </button>
                <button onclick="window.location.href='/static/planner.html'" style="background: #17a2b8; margin-left: 10px;">
                    📅 Lernplaner
                </button>
                <button onclick="window.location.href='/static/grades.html'" style="background: #e0a800; margin-left: 10px;">
                    📊 Noten
                </button>
                <button onclick="window.location.href='/test'" style="background: #28a745; margin-left: 10px;">
                    🧪 Test-Modus
                </button>
                <button onclick="window.location.href='/chat'" style="background: #007bff; margin-left: 10px;">
                💬 KI-Chat
                </button>
                <button onclick="window.location.href='/game'" style="background: #444; margin-left: 10px; cursor: default;">
                🎮 Spielen
                </button>
            </div>
        </header>

        <div class="card">
            <h2>Neues PDF hochladen</h2>
            <p style="color: #666; margin-bottom: 20px;">
                Lade hier deine Hefteinträge oder Zusammenfassungen hoch. 
                Die KI liest sie und erstellt passende Übungsaufgaben dazu.
            </p>

            <div style="display: flex; flex-direction: column; gap: 15px;">
                
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: bold;">Fach wählen:</label>
                    <select id="subjectSelect" style="width: 100%; padding: 12px;">
                        <option value="">Lade Fächer...</option>
                    </select>
                </div>

                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px dashed #ccc;">
                    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                        <span style="color: #666; font-size: 0.9em; white-space: nowrap;">Fach nicht dabei?</span>
                        <input type="text" id="newSubjectInput" placeholder="Neues Fach eingeben..." style="flex-grow: 1; min-width: 150px;">
                        <button onclick="addNewSubjectMaterial()" class="secondary" style="width: auto; padding: 10px 15px;">➕ Hinzufügen</button>
                    </div>
                </div>
                
                <div>
                    <label style="display: block; margin-bottom: 5px; font-weight: bold; margin-top: 10px;">Datei (PDF):</label>
                    <input type="file" id="fileInput" accept=".pdf" style="width: 100%; padding: 10px; background: #f8f9fa; border-radius: 8px;">
                </div>
                
                <button onclick="uploadFile()" class="success" id="uploadBtn" style="width: 100%; margin-top: 10px; font-size: 1.1em; padding: 15px;">
                    🚀 Analysieren & Speichern
                </button>
            </div>

            <div id="status" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script src="/static/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuthentication();
            loadSubjects();
        });

        async function loadSubjects() {
            const select = document.getElementById('subjectSelect');
            select.innerHTML = '<option value="">-- Bitte wählen --</option>';

            try {
                const res = await apiCall('/api/school-context');
                if(res.data && res.data.subjects) {
                    let subjs = res.data.subjects; 
                    if(typeof subjs === 'string') {
                        subjs = subjs.replace(/[\[\]"]/g, '').split(',');
                    }
                    subjs = subjs.map(s => s.trim()).filter(s => s !== "");
                    subjs.sort();

                    subjs.forEach(s => {
                        let opt = document.createElement('option');
                        opt.value = s;
                        opt.innerText = s;
                        select.appendChild(opt);
                    });
                }
            } catch(e) {
                console.error("Fehler beim Laden der Fächer:", e);
            }
        }

        async function addNewSubjectMaterial() {
            const newSubj = document.getElementById('newSubjectInput').value.trim();
            if (!newSubj) return;

            try {
                const res = await apiCall('/api/subjects', 'POST', { subject: newSubj });
                if (res.success) {
                    document.getElementById('newSubjectInput').value = '';
                    loadSubjects(); 
                    const status = document.getElementById('status');
                    status.innerHTML = `<p style="color: green;">Fach '${newSubj}' hinzugefügt!</p>`;
                    setTimeout(() => status.innerHTML = '', 3000);
                }
            } catch (e) {
                alert("Fehler beim Hinzufügen des Fachs.");
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const subject = document.getElementById('subjectSelect').value;
            
            if(!subject) return alert("Bitte wähle zuerst ein Fach aus!");
            if(fileInput.files.length === 0) return alert("Bitte wähle eine PDF-Datei aus!");
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            
            const url = `/api/upload-material?subject=${encodeURIComponent(subject)}`;
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `
                <div style="background: #e2e3e5; padding: 15px; border-radius: 5px; text-align: center;">
                    <p>⏳ <strong>KI analysiert dein Dokument...</strong></p>
                    <p style="font-size: 0.9em;">Das kann kurz dauern. Bitte warten.</p>
                </div>`;
            document.getElementById('uploadBtn').disabled = true;

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }, 
                    body: formData
                });
                
                const result = await response.json();
                
                if(result.success) {
                    statusDiv.innerHTML = `
                        <div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; border: 1px solid #c3e6cb;">
                            <h3>✅ Analyse erfolgreich!</h3>
                            <p>Das Wissen wurde gespeichert.</p>
                            <hr style="margin: 10px 0; border-color: #c3e6cb;">
                            <p><strong>KI-Zusammenfassung (Vorschau):</strong></p>
                            <div style="background: white; padding: 10px; border-radius: 5px; font-size: 0.9em; max-height: 200px; overflow-y: auto;">
                                ${result.summary_preview}
                            </div>
                        </div>`;
                } else {
                    throw new Error(result.detail || "Unbekannter Fehler");
                }
            } catch(e) {
                statusDiv.innerHTML = `
                    <div style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px;">
                        ❌ <strong>Upload fehlgeschlagen:</strong><br>
                        ${e.message}
                    </div>`;
            } finally {
                document.getElementById('uploadBtn').disabled = false;
            }
        }
    </script>
</body>
</html>

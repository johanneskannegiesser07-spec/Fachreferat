<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schul-Konfiguration - KI-Lern-Buddy</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🤖 KI-Lern-Buddy</h1>
                <p>Intelligente Lernunterstützung mit KI-Personalisierung</p>
            </div>
            <div class="user-info">
                <div class="stats-container">
                    <div class="stat-badge gems-badge" title="Gems">
                        💎 <span id="headerGems">0</span>
                    </div>
                    <div class="stat-badge xp-badge" title="XP">
                        ✨ <span id="headerXP">0</span> XP
                    </div>
                </div>
                <button class="dashboard-btn" onclick="window.location.href='/'">🏠 Dashboard</button>
                <span id="usernameDisplay">Lade...</span>
                <button class="logout" onclick="logout()">Logout</button>
            </div>

            <div class="nav_bar">
                <button onclick="window.location.href='/flashcards'">🃏 Karten</button>
                <button onclick="window.location.href='/planner'" style="background: #17a2b8;">📅 Planer</button>
                <button onclick="window.location.href='/grades'" style="background: #e0a800;">📊 Noten</button>
                <button onclick="window.location.href='/materials'" style="background: #fd7e14;">📄 Material</button>
                <button onclick="window.location.href='/test'" style="background: #28a745;">🧪 Test</button>
                <button onclick="window.location.href='/chat'" style="background: #007bff;">💬 Chat</button>
                <button onclick="window.location.href='/game'" style="background: #6610f2;">🎮 Spielen</button>
            </div>
        </header>

        <div class="card" id="schoolForm">
            <h2>⚙️ Grundeinstellungen</h2>
            
            <div class="form-group">
                <label>Schulart:</label>
                <select id="schoolType">
                    <option value="Gymnasium">Gymnasium</option>
                    <option value="Realschule">Realschule</option>
                    <option value="FOS/BOS">FOS / BOS</option>
                    <option value="Mittelschule">Mittelschule</option>
                    <option value="Uni">Universität / Hochschule</option>
                    <option value="Ausbildung">Berufsausbildung</option>
                </select>
            </div>

            <div class="form-group">
                <label>Klasse / Stufe:</label>
                <input type="text" id="schoolGrade" placeholder="z.B. 10, Q11, FOS12">
            </div>

            <div class="form-group">
                <label>Bundesland:</label>
                <select id="federalState">
                    <option value="">Lade Bundesländer...</option>
                </select>
            </div>

            <div class="form-group" style="margin-top: 20px;">
                <button onclick="saveSchoolData()" class="success" style="width: 100%;">✅ Einstellungen Speichern</button>
            </div>
        </div>

        <div class="card" style="margin-top: 20px; border-top: 1px solid #eee;">
            <h2>📚 Meine Fächer verwalten</h2>
            <p style="color: #666; font-size: 0.9em;">Hier siehst du alle deine aktiven Fächer. Du kannst sie hier zentral bearbeiten.</p>
            
            <div class="form-group" style="margin-top: 15px;">
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="setupNewSubject" placeholder="Neues Fach (z.B. Spanisch)" style="flex-grow: 1;">
                    <button onclick="addSubjectInSetup()" class="secondary" style="width: auto;">Hinzufügen</button>
                </div>
            </div>

            <div id="setupSubjectsList" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px;">
                Lade Fächer...
            </div>
        </div>
    </div>

    <script src="/static/common.js"></script>
    <script src="/static/school-setup.js"></script>
</body>
</html>

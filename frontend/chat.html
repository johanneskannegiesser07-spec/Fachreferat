<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 KI-Tutor - Lern-Buddy</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Spezifisches Chat Design */
        .chat-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            height: 75vh;
        }
        
        /* Linke Sidebar (Fächer) */
        .subject-list {
            background: white;
            border-radius: 15px;
            padding: 15px;
            overflow-y: auto;
            border: 1px solid #eee;
        }
        .subject-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-weight: 500;
            color: #333;
            transition: all 0.2s;
        }
        .subject-btn:hover { background: #e9ecef; }
        .subject-btn.active {
            background: #e7f3ff;
            border-color: #667eea;
            color: #0056b3;
            font-weight: bold;
        }

        /* Rechter Chat Bereich */
        .chat-window {
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #eee;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #eee;
            background: #f8f9fa;
            font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .messages-area {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .input-area {
            padding: 15px;
            border-top: 1px solid #eee;
            background: #f8f9fa;
            display: flex;
            gap: 10px;
        }

        /* Bubbles */
        .msg {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 0.95rem;
            position: relative;
        }
        .msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .msg-ai {
            align-self: flex-start;
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 2px;
        }
        .msg-ai strong { color: #6f42c1; }
        
        /* Mobile */
        @media (max-width: 768px) {
            .chat-layout { grid-template-columns: 1fr; grid-template-rows: 60px 1fr; }
            .subject-list { display: flex; overflow-x: auto; padding: 10px; white-space: nowrap; gap: 10px; }
            .subject-btn { width: auto; margin: 0; padding: 8px 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header style="margin-bottom: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1 style="font-size: 1.8rem; margin: 0;">💬 KI-Tutor</h1>
                <!-- <button onclick="window.location.href='/'" class="secondary" style="padding: 8px 15px;">⬅️ Dashboard</button> -->
            </div>
            <div class="user-info">
                <span id="usernameDisplay">Lade...</span>
                <button class="logout" onclick="window.location.href='/'">📊 Dashboard</button>
            </div>
        </header>

        <div class="chat-layout">
            <div class="subject-list" id="subjectList">
                <p style="color:#888; text-align:center; font-size:0.9em;">Lade Fächer...</p>
            </div>

            <div class="chat-window">
                <div class="chat-header">
                    <span id="currentSubjectTitle">Bitte Fach wählen 👈</span>
                    <span style="font-size: 0.8em; color: green; display:none;" id="typingIndicator">Schreibt...</span>
                </div>
                
                <div class="messages-area" id="messagesArea">
                    <div style="text-align: center; color: #aaa; margin-top: 50px;">
                        <p>Wähle ein Fach und stelle eine Frage!</p>
                        <p style="font-size:0.8em;">Der Tutor nutzt deine hochgeladenen PDFs als Wissen.</p>
                    </div>
                </div>
                
                <div class="input-area">
                    <input type="text" id="chatInput" placeholder="Deine Frage..." disabled onkeypress="handleEnter(event)">
                    <button id="sendBtn" onclick="sendMessage()" disabled>Senden ➤</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/common.js"></script>
    <script>
        let currentSubject = null;
        let chatHistory = []; // {user: "", ai: ""}

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuthentication();
            loadSubjects();
        });

        async function loadSubjects() {
            const list = document.getElementById('subjectList');
            try {
                const res = await apiCall('/api/school-context');
                if(res.data && res.data.subjects) {
                    list.innerHTML = '';
                    let subjs = res.data.subjects;
                    if(typeof subjs === 'string') subjs = subjs.replace(/[\[\]"]/g, '').split(',');
                    
                    subjs.sort().forEach(s => {
                        s = s.trim();
                        if(!s) return;
                        const btn = document.createElement('div');
                        btn.className = 'subject-btn';
                        btn.innerText = s;
                        btn.onclick = () => selectSubject(s, btn);
                        list.appendChild(btn);
                    });
                }
            } catch(e) { console.error(e); }
        }

        function selectSubject(subject, btnElement) {
            currentSubject = subject;
            chatHistory = []; // Reset history bei Fachwechsel
            
            // UI Update
            document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            
            document.getElementById('currentSubjectTitle').innerText = "Fach: " + subject;
            document.getElementById('messagesArea').innerHTML = `
                <div class="msg msg-ai">
                    Hallo! Ich bin dein Tutor für <strong>${subject}</strong>. 
                    Ich habe Zugriff auf deine Unterlagen. Was möchtest du wissen?
                </div>
            `;
            
            // Enable Input
            document.getElementById('chatInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('chatInput').focus();
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg || !currentSubject) return;
            
            // 1. User Message anzeigen
            appendMessage(msg, 'user');
            input.value = '';
            
            // 2. Loading State
            document.getElementById('typingIndicator').style.display = 'inline';
            const messagesArea = document.getElementById('messagesArea');
            messagesArea.scrollTop = messagesArea.scrollHeight;

            try {
                // 3. API Call
                const res = await apiCall('/api/chat', 'POST', {
                    message: msg,
                    subject: currentSubject,
                    history: chatHistory
                });
                
                document.getElementById('typingIndicator').style.display = 'none';

                if(res.success) {
                    // 4. AI Antwort anzeigen
                    appendMessage(res.response, 'ai');
                    
                    // History updaten
                    chatHistory.push({user: msg, ai: res.response});
                    // Max History Länge begrenzen (Memory-Management)
                    if(chatHistory.length > 10) chatHistory.shift();
                } else {
                    appendMessage("Fehler: " + res.detail, 'ai');
                }
            } catch(e) {
                document.getElementById('typingIndicator').style.display = 'none';
                appendMessage("Verbindungsfehler. Bitte versuche es erneut.", 'ai');
            }
        }

        function appendMessage(text, sender) {
            const area = document.getElementById('messagesArea');
            const div = document.createElement('div');
            div.className = `msg msg-${sender}`;
            
            // === FIX FÜR JSON-ANTWORTEN ===
            // Falls die KI versehentlich JSON schickt (startet mit { und endet mit }),
            // versuchen wir, den reinen Text rauszuholen.
            if (sender === 'ai' && typeof text === 'string') {
                const trimmed = text.trim();
                if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
                    try {
                        const jsonParsed = JSON.parse(trimmed);
                        // Wir suchen nach typischen Schlüsseln oder nehmen den ersten Wert
                        text = jsonParsed.Antwort || jsonParsed.answer || jsonParsed.message || Object.values(jsonParsed)[0] || text;
                    } catch (e) {
                        // Kein gültiges JSON, wir lassen den Text so
                        console.log("JSON Parse Versuch fehlgeschlagen", e);
                    }
                }
            }
            // ==============================
            
            // Markdown parsen für AI, Text für User
            if(sender === 'ai') {
                // marked.parse verarbeitet Markdown zu HTML
                div.innerHTML = marked.parse(text);
            } else {
                div.textContent = text;
            }
            
            area.appendChild(div);
            area.scrollTop = area.scrollHeight;
        }
    </script>
</body>
</html>

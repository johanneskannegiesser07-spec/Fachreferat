<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🃏 Karteikarten</title>
    <link rel="stylesheet" href="/static/style.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>

    <style>
        /* Flashcard Styles direkt hier oder in style.css */
        .flashcard-container { perspective: 1000px; width: 100%; max-width: 600px; margin: 40px auto; height: 350px; }
        .flashcard { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 10px; padding: 20px; background: #fff; border: 2px solid #ddd; }
        .card-front { background-color: #fff; color: #333; border-color: #007bff; }
        .card-back { background-color: #f8f9fa; color: #333; transform: rotateY(180deg); border-color: #28a745; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🤖 KI-Lern-Buddy</h1>
                <p>Intelligente Lernunterstützung mit KI-Personalisierung</p>
            </div>
            <div class="user-info">
                <div class="stats-container">
                    <div class="stat-badge gems-badge" title="Gems">
                        💎 <span id="headerGems">0</span>
                    </div>
                    <div class="stat-badge xp-badge" title="XP">
                        ✨ <span id="headerXP">0</span> XP
                    </div>
                </div>
                <button class="dashboard-btn" onclick="window.location.href='/'">🏠 Dashboard</button>
                <span id="usernameDisplay">Lade...</span>
                <button class="logout" onclick="logout()">Logout</button>
            </div>

            <div class="nav_bar">
                <button disabled>🃏 Karten</button>
                
                <button onclick="window.location.href='/planner'" style="background: #17a2b8;">📅 Planer</button>
                <button onclick="window.location.href='/grades'" style="background: #e0a800;">📊 Noten</button>
                <button onclick="window.location.href='/materials'" style="background: #fd7e14;">📄 Material</button>
                <button onclick="window.location.href='/test'" style="background: #28a745;">🧪 Test</button>
                <button onclick="window.location.href='/chat'" style="background: #007bff;">💬 Chat</button>
                <button onclick="window.location.href='/game'" style="background: #6610f2;">🎮 Spielen</button>
            </div>
        </header>

        <div id="setup" class="card">
            <h2>✨ Neues Set generieren</h2>
            <div class="form-group">
                <input type="text" id="fcSubject" placeholder="Fach (z.B. Englisch)" value="Englisch">
                <input type="text" id="fcTopic" placeholder="Thema (z.B. Vokabeln Unit 1)" value="Business Terms">
                <button onclick="startFlashcards()" class="success">Karten erstellen 🪄</button>
            </div>
            <div id="historyCard" style="margin-top: 20px;">
                <h3>📂 Deine Sets</h3>
                <div id="historyList">Lade Historie...</div>
            </div>
        </div>

        <div id="player" class="hidden">
            <div class="card" style="text-align: center;">
                <h3 id="topicDisplay" style="margin-bottom: 20px; color: #666;">Thema</h3>
                
                <div class="flashcard-container" onclick="flipCard()">
                    <div class="flashcard" id="currentCard">
                        <div class="card-face card-front">
                            <div style="font-size: 0.9em; color: #888; margin-bottom: 10px;">FRAGE</div>
                            <div id="cardFrontText" class="card-content">Frage...</div>
                            <div class="card-hint">👆 Tippen zum Umdrehen</div>
                        </div>
                        <div class="card-face card-back">
                            <div style="font-size: 0.9em; color: #888; margin-bottom: 10px;">ANTWORT</div>
                            <div id="cardBackText" class="card-content">Antwort...</div>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button onclick="prevCard()" class="secondary">⬅️</button>
                    <div id="counter" style="align-self:center; font-weight:bold;">1 / 5</div>
                    <button onclick="nextCard()" class="success">➡️</button>
                </div>
                <button onclick="deleteCard()" class="secondary" style="margin-top: 20px; background-color: red;">Löschen 🗑️</button>
                <button onclick="location.reload()" class="secondary" style="margin-top: 20px;">Beenden</button>
            </div>
        </div>
        
        <div id="output" class="output" style="display: none;"></div>
        <div id="debug" class="debug"></div>
    </div>

    <script src="/static/common.js"></script>
    <script src="/static/flashcards.js"></script>
</body>
</html>
